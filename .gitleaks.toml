# Gitleaks configuration for PwndaWallet.
#
# The default ruleset stays on. The exceptions below are values that are PUBLIC BY
# DESIGN (test vectors, addresses, public keys) which the generic-api-key rule takes for
# secrets. Each one is a decision with a reason. They are EXACT values, not file paths,
# so a real secret added to one of these files later is still found.
#
# If gitleaks flags something new: if it is a real secret, remove it and rotate it. If it
# is a genuine test vector, add the exact value to a group here and say why it is safe.

title = "PwndaWallet gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ethereum-style addresses (0x + 40 hex) are public identifiers: token contracts and test addresses"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

[[allowlists]]
description = "XELIS seed/address vectors (src/wallets/xelis-vectors.ts): produced by the real xelis_wallet binary from throwaway TESTNET wallets during a spike; the private keys are derived from those seeds and hold nothing"
regexTarget = "secret"
regexes = [
  '''^1a7f4b7ebc735a13d4c8ba8c4374816971f90b84e0748a61ea8659005b699304$''',
  '''^d8aea64e3b110e3ba0997b4be33ededcd23006e280c41d422412af766d277a03$''',
  '''^a1998a84ce1b116dad657a708ff0911fa4a509b6b1633d43dd2419c22415e504$''',
  '''^1b1b9dccb9370bbf899891f10bd62cb2755f005108f80a854a14307946194c01$''',
  '''^eb6a8bd01b58093ba1430d7482736e26edb876afb8e83bf49fe3c4e848d0030e$''',
  '''^ee7264ef78c7168a9eca794f59be9d06abe4b7eb5ec77210d5de9c4583a90606$''',
]

[[allowlists]]
description = "Monero polyseed reference vector (scripts/polyseed-sync-hardcoded.mjs, src-tauri/src/xmr_rpc.rs): the published polyseed reference vector, labelled in-file; no funds"
regexTarget = "secret"
regexes = [
  '''^6dd6b2029bfdf1c44a36ce8b229f35dcaa5800b8d858da9facf4b0a778dc2800$''',
  '''^3c56a3cc3e7f94dc428ffe3b856adb6054552dfa14360d4cdec3f7730b999107$''',
]

[[allowlists]]
description = "canonical Exodus-Cardano address for the BIP39 test vector (derivation-detector.test.ts): an ADDRESS derived from the world-public 'abandon abandon ... about' mnemonic"
regexTarget = "secret"
regexes = [
  '''^addr1q9av2w6nz9tzv8rc3vfqs95av844gkcqxm0qeezvlf07p3r6c5a4xy2kycw83zcjpqtf6c0t23dsqdk7pnjye7jlurzqm0pqxa$''',
]

[[allowlists]]
description = "wire-protocol test fixtures (src-tauri/src/desk/wire.rs): public curve points and public keys inside request fixtures; no secret material"
regexTarget = "secret"
regexes = [
  '''^083844dd8e9fc41db28dcacad796a8a0bc1209050eb7cd13b66b61a53221ee12$''',
  '''^a61b5c67b605d4fafbfcbe5b1a28f40f69698bac6b0b0beae3b4d96eff807ecd$''',
]

[[allowlists]]
description = "Zano vectors (src/wallets/zano-keys.test.ts): verbatim from simplewallet v2.2.1.506 for a throwaway test wallet"
regexTarget = "secret"
regexes = [
  '''^e02e2b994d9b98eb9578ebe55e0178ee03bb998b0cef3da4cbd52d3f00ebbc0f$''',
]

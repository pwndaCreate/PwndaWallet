name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref: a newer push supersedes an older one still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.repository == 'pwndaCreate/PwndaWallet'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-boundaries.mjs
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    if: github.repository == 'pwndaCreate/PwndaWallet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # rustc's default codegen stack is too small for the largest module here.
      RUST_MIN_STACK: 16777216
    steps:
      - uses: actions/checkout@v4
      - name: Install the Tauri 2 build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Stage the bundle-resource placeholder
        # tauri-build fails when `binaries/*` matches nothing. The real payloads are
        # produced by the release pipeline (`npm run fetch-sidecars`), never committed.
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/.gitkeep
      - name: Fetch the pinned BasicSwap source
        # Two tests read upstream/basicswap. The pin is scripts/fetch-swap-runtime.mjs;
        # reading it here keeps this workflow from holding a second copy.
        run: |
          commit=$(sed -n 's/^const PIN_BASICSWAP_COMMIT = "\([0-9a-f]\{40\}\)";$/\1/p' scripts/fetch-swap-runtime.mjs)
          test -n "$commit"
          git init -q upstream/basicswap
          git -C upstream/basicswap fetch -q --depth 1 https://github.com/basicswap/basicswap "$commit"
          git -C upstream/basicswap checkout -q FETCH_HEAD
      - run: cargo build --locked --no-default-features
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  secret-scan:
    if: github.repository == 'pwndaCreate/PwndaWallet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
